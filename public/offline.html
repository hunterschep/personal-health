<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#295e50" />
    <title>CareCadence is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2e9;
        color: #18342e;
        padding: 24px;
      }
      main {
        max-width: 520px;
        border: 1px solid #d9d8cb;
        border-radius: 24px;
        background: #fffcf5;
        padding: 36px;
        box-shadow: 0 24px 70px rgba(31, 48, 42, 0.1);
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 2.4rem;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.7;
        color: #49645d;
      }
      a {
        display: inline-block;
        border: 0;
        border-radius: 999px;
        background: #295e50;
        color: white;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111d1a;
          color: #edf1e8;
        }
        main {
          background: #172621;
          border-color: #33463f;
        }
        p {
          color: #b3c0b7;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your private data stays online-only</h1>
      <p>
        CareCadence is offline. Authenticated health information is deliberately not cached on this
        device. Reconnect to open your care plan and records.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
