name: carecadence

x-database-environment: &database-environment
  POSTGRES_USER: "${POSTGRES_USER:-carecadence}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-carecadence}"
  POSTGRES_DB: "${POSTGRES_DB:-carecadence}"

x-app-environment: &app-environment
  DATABASE_URL: "postgresql://${POSTGRES_USER:-carecadence}:${POSTGRES_PASSWORD:-carecadence}@db:5432/${POSTGRES_DB:-carecadence}"
  AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env}"
  AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  APP_BASE_URL: "${APP_BASE_URL:-http://localhost:3000}"
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
  SOURCE_SYNC_ENABLED: "${SOURCE_SYNC_ENABLED:-false}"
  SOURCE_STALE_DAYS: "${SOURCE_STALE_DAYS:-180}"
  DEMO_SEED_ENABLED: "${DEMO_SEED_ENABLED:-false}"
  DEMO_USER_EMAIL: "${DEMO_USER_EMAIL:-demo@carecadence.local}"
  DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-carecadence-demo-only}"
  DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-America/New_York}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  REMINDER_DISPATCH_SECRET: "${REMINDER_DISPATCH_SECRET:-}"
  AUTH_RATE_LIMIT_ATTEMPTS: "${AUTH_RATE_LIMIT_ATTEMPTS:-8}"
  AUTH_RATE_LIMIT_WINDOW_MINUTES: "${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}"
  SESSION_DURATION_DAYS: "${SESSION_DURATION_DAYS:-30}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  BUILD_VERSION: "${BUILD_VERSION:-development}"

services:
  db:
    image: postgres:18-bookworm
    environment: *database-environment
    volumes:
      - postgres-data:/var/lib/postgresql
    # Loopback-only access supports local pnpm development without exposing the
    # database on the LAN. Remove this mapping on a remote Docker host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    build:
      context: .
      target: tools
    environment: *app-environment
    command: ["sh", "-c", "pnpm db:migrate:deploy && pnpm db:seed"]
    volumes:
      - private-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
    environment: *app-environment
    volumes:
      - private-uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health?mode=readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  private-uploads:
